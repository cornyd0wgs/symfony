services:
  industries_mysql:
    image: mysql:8.0
    container_name: industries_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3310:3306"
    volumes:
      - industries_db_data:/var/lib/mysql
    networks:
      - industries_network

  industries_phpmyadmin:
    image: phpmyadmin
    container_name: industries_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: industries_mysql
    ports:
      - "8081:80"
    depends_on:
      - industries_mysql
    networks:
      - industries_network

volumes:
  industries_db_data:

networks:
  industries_network: